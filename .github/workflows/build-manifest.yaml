# https://github.com/paritytech/devops/issues/5759
name: Build manifest

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  build-manifest:
    name: Images
    uses: paritytech/ci-actions/.github/workflows/build-manifest.yaml@main
    with:
      # Build-only on PRs; build and push on merge to main and on `v*` tags.
      push: ${{ github.event_name == 'push' }}
      environment: ${{ github.event_name == 'push' && 'docker-publish' || null }}
      # Release tags also get the immutable `v*` tag alongside the default <date>-<sha>.
      # Deliberately not applied to main, which would create a mutable `:main` tag.
      extraTags: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
    secrets:
      GCP_SA_GITHUB: ${{ secrets.GCP_SA_GITHUB }}
      GCP_WIP_GITHUB: ${{ secrets.GCP_WIP_GITHUB }}
